function resumeSectionHtml(key,p,X,P,G){

if(key==="summary"&&p.summary)html='<section><h2>Professional Summary</h2><p>'+E(p.summary)+'</p></section>';

if(key==="certs")html=resumeCerts(true);

function buildResume(){
var p=S.profile,rAccent=RESUME_ACCENTS[S.resume.accent]||"#0d9488";
var X=S.experiences.filter(function(x){return incOn("experiences",x.id)});
var P=S.projects.filter(function(x){return incOn("projects",x.id)});
var G=S.skills.filter(function(x){return incOn("skills",x.id)});

}

var resumePrintFrame=null;
function resumeName(){return (S.profile.name||'resume').replace(/[<>:"/\\|?*\x00-\x1f]/g,'').trim().replace(/\s+/g,'_').toLowerCase()||'resume'}
function resumePrintCss(){return '@page{size:A4;margin:0}'
+'html,body{margin:0!important;padding:0!important;background:white!important;color:#202733!important;width:auto!important;min-height:0!important}'
+'*,*::before,*::after{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}'
+'#paper{zoom:1!important;width:794px!important;max-width:none!important;min-height:0!important;margin:0!important;padding:48px 56px!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important;-webkit-box-decoration-break:clone!important;box-decoration-break:clone!important}'
+'#paper h2,#paper .job-head,#paper .job>.meta,#paper .job>.sub{break-after:avoid;page-break-after:avoid}'
+'#paper .job{break-inside:avoid}#paper section{break-inside:auto}#paper .resume-header{break-inside:avoid}'

async function downloadPdf(){
  if(resumePrintFrame)return;
  var button=document.querySelector('[data-act="dl-pdf"]');
  if(button)button.disabled=true;
  try{
    var paper=document.querySelector('#paper');
    if(!paper){toast('Open the resume preview first');return}
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    var styles=Array.from(document.querySelectorAll('style')).map(function(s){return s.textContent}).join('\n');
    var frame=document.createElement('iframe');
    frame.title='Resume PDF';frame.setAttribute('aria-hidden','true');
    // Keep a real, full-width layout: display:none produces blank printouts.
    frame.style.cssText='position:fixed;left:-10000px;top:0;width:794px;height:1123px;border:0;pointer-events:none';
    document.body.appendChild(frame);resumePrintFrame=frame;
    var doc=frame.contentDocument;
    var printPaper=paper.cloneNode(true);printPaper.querySelectorAll('.noprint').forEach(function(n){n.remove()});printPaper.removeAttribute('draggable');printPaper.querySelectorAll('[draggable]').forEach(function(n){n.removeAttribute('draggable')});
    doc.open();doc.write('<!doctype html><html><head><meta charset="utf-8"><title>'+E(resumeName()+(view==='cover'?'_cover_letter':'_resume'))+'</title><style>'+styles+'</style></head><body>'+printPaper.outerHTML+'<\/body><\/html>');doc.close();
    var printStyle=doc.createElement('style');
    printStyle.textContent=resumePrintCss();
    doc.head.appendChild(printStyle);
    if(doc.fonts&&doc.fonts.ready)await doc.fonts.ready;
    await new Promise(function(resolve){frame.contentWindow.requestAnimationFrame(function(){frame.contentWindow.requestAnimationFrame(resolve)})});
    var originalTitle=document.title;document.title=resumeName()+(view==='cover'?'_cover_letter':'_resume');
    var cleanup=function(){if(resumePrintFrame===frame){frame.remove();resumePrintFrame=null;document.title=originalTitle}};
    frame.contentWindow.addEventListener('afterprint',cleanup,{once:true});
    toast('Choose Save as PDF. Keep scale at 100%.');
    frame.contentWindow.focus();frame.contentWindow.print();
    // Some browsers do not emit afterprint for child frames. The dialog is
    // normally blocking; retain the frame briefly for engines that print later.
    setTimeout(cleanup,60000);
  }catch(e){console.error('Resume PDF failed',e);if(resumePrintFrame){resumePrintFrame.remove();resumePrintFrame=null}toast('Could not open PDF printing. Please try again.')}
  finally{if(button)button.disabled=false}
}

{g:"Getting Started",id:"s1",title:"Your first steps",body:"<ul><li>Add relevant jobs, projects, training, and volunteering to the Experience Bank.</li><li>Write two or three achievement bullets using facts you can explain.</li><li>Track a few suitable roles and give each a next action.</li></ul><p>Start with what you have; you can improve it over time.</p>"},

"backup":function(){dlBlob("career-hub-backup.json",new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));toast("Backup downloaded")},
"restore":function(){var f=document.createElement("input");f.type="file";f.accept=".json,application/json";f.onchange=async function(){try{var raw=JSON.parse(await f.files[0].text());if(!raw||typeof raw!=="object"||!raw.profile||typeof raw.profile!=="object"||Array.isArray(raw.profile)||!Array.isArray(raw.experiences))throw new Error("Invalid backup");if(COLLECTIONS.some(function(k){return raw[k]!=null&&(!Array.isArray(raw[k])||raw[k].some(function(x){return !x||typeof x!=="object"||Array.isArray(x)}))}))throw new Error("Invalid backup");if(raw.version>VER)throw new Error("Unsupported backup version");var restored=norm(migrate(raw));if(!confirm("Replace current data with this backup?"))return;sampleMode=false;storageReadOnly=false;S=restored;save();render();toast("Backup restored")}catch(e){toast("Invalid backup — data unchanged")}};f.click()},
close:function(){$("#dlg").close()},
new:function(b){edit(b.dataset.col,null)},

inc:function(b){var k=b.dataset.kind+":"+b.dataset.id;S.resume.inc[k]=b.checked;save();refreshPaper()},
tpl:function(b){if(RESUME_TEMPLATES.indexOf(b.dataset.id)<0)return;S.resume.template=b.dataset.id;save();render()},
raccent:function(b){if(!Object.prototype.hasOwnProperty.call(RESUME_ACCENTS,b.dataset.id))return;S.resume.accent=b.dataset.id;save();render()},
"dl-pdf":function(){downloadPdf()},
"mark-applied":function(b){var a=S.applications.filter(function(x){return x.id===b.dataset.id})[0];if(!a)return;a.status="Applied";if(!a.applied)a.applied=iso();save();render();toast("Marked as applied")},
"draft-email":function(b){var a=S.applications.filter(function(x){return x.id===b.dataset.id})[0]||{company:"[Company]",role:"[Role]"};var today=iso();var days=Math.floor((Date.now()-new Date((a.applied||today)+"T00:00"))/86400000);var tpl="Hi "+(a.contact||"[Name]")+",\n\nQuick follow-up on my application for the "+a.role+" role at "+a.company+(days>0?" — sent "+days+" day"+(days===1?"":"s")+" ago":"")+".\n\nI'm still very interested and would love to know if there's any update on timing. Happy to share additional work samples if useful.\n\nThanks for your time,\n"+(S.profile.name||"[Your name]");openInfo("Draft follow-up email",'<label>Copy and paste into your email<textarea id="emailtext" rows="12">'+E(tpl)+'</textarea></label><div class="foot"><button type="button" data-act="close">Close</button><button class="primary" data-act="copy-email">Copy</button></div>')},
"copy-email":function(){var t=$("#emailtext");if(t)Promise.resolve().then(function(){if(!navigator.clipboard)throw new Error("Clipboard unavailable");return navigator.clipboard.writeText(t.value)}).then(function(){toast("Copied")}).catch(function(){toast("Copy failed")})},
reset:function(){if(sampleMode){toast("Exit sample first");return}if(confirm("Erase ALL data? Cannot undo.")&&confirm("Really erase everything?")){storageReadOnly=false;S=blank();save();render();toast("Reset")}}

document.addEventListener("click",function(e){
if(Date.now()-lastDrop<300)return;
var t=e.target.closest("[data-act]");if(!t)return;
if(t.tagName==="SELECT"||t.tagName==="INPUT"||t.tagName==="TEXTAREA")return;
if(t.tagName==='FORM'||(t.type==='submit'&&t.closest('form')))return;var fn=Object.prototype.hasOwnProperty.call(A,t.dataset.act)?A[t.dataset.act]:null;if(fn)fn(t);
});
document.addEventListener("change",function(e){
var t=e.target;
if(t.dataset.act==='cover-edit'){A['cover-edit'](t);return}
if(t.type==="checkbox"&&t.dataset.act&&A[t.dataset.act]){A[t.dataset.act](t)}
else if(t.tagName==="SELECT"&&t.dataset.act&&A[t.dataset.act]){A[t.dataset.act](t)}
else if(t.dataset&&t.dataset.note){A['note-edit'](t)}
});
document.addEventListener("input",function(e){var t=e.target;if(t.dataset.act==='cover-edit'){A['cover-edit'](t);return}if(t.dataset&&t.dataset.note){A['note-edit'](t)}});
document.addEventListener("keydown",function(e){var card=e.target.closest&&e.target.closest(".kcard[data-act=edit]");if(card&&(e.key==="Enter"||e.key===" ")){e.preventDefault();A.edit(card)}});
document.addEventListener("submit",function(e){
var act=e.target.dataset.act;if(act&&Object.prototype.hasOwnProperty.call(A,act)){e.preventDefault();A[act](e.target)}
});
document.addEventListener("dragstart",function(e){var row=e.target.closest('[data-resume-section]');if(!row||view!=='resume')return;if(e.target.closest('button,input,textarea,select')){e.preventDefault();return}e.dataTransfer.setData('application/x-career-section',row.dataset.resumeSection);e.dataTransfer.effectAllowed='move';row.classList.add('section-dragging')});
