function fitResumePreview(){
  var wrap=document.querySelector('#paper-wrap'),paper=document.querySelector('#paper');
  if(!wrap||!paper)return;
  applyPaperSizes(paper);
  var cs=getComputedStyle(wrap);
  var pageW=(S.resume.pageSize==='letter'?816:794);
  var available=(wrap.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight))/pageW;
  var scale=Math.min(1,Math.max(.2,available));
  if(S.settings.focus){
    var pref=S.resume.preview||{mode:'custom',zoom:90};
    previewMode=pref.mode;
    previewZoom=pref.zoom/100;
    if(previewMode==='page')scale=Math.max(.2,Math.min(scale,(innerHeight-wrap.getBoundingClientRect().top-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-24)/paper.offsetHeight));
    if(previewMode==='custom')scale=Math.min(available,previewZoom);
  }
  paper.style.zoom=String(scale);
  var output=document.querySelector('.preview-percent');
  if(output)output.textContent=Math.round(scale*100)+'%';
}

async function downloadPdf(){
  if(resumePrintFrame)return;
  var button=document.querySelector('[data-act="dl-pdf"]');
  if(button)button.disabled=true;

    var paper=document.querySelector('#paper');

    var styles=Array.from(document.querySelectorAll('style')).map(function(s){return s.textContent}).join('\n');

    var printPaper=paper.cloneNode(true);printPaper.querySelectorAll('.noprint').forEach(function(n){n.remove()});printPaper.removeAttribute('draggable');printPaper.querySelectorAll('[draggable]').forEach(function(n){n.removeAttribute('draggable')});

}

{g:"Negotiation",id:"n1",title:"Take time to review an offer",body:"<p>Ask for the offer in writing and confirm the response deadline. Request time to review if needed; the employer may have a fixed deadline.</p><blockquote>Thank you for the offer. Could you send the full terms and confirm when you need my decision?</blockquote>"},

"focus-save":function(form){if(!form.reportValidity())return;var col=form.dataset.col,d=Object.fromEntries(new FormData(form)),data=clean(col,col==='profile'?Object.assign({},S.profile,d):d);if(data.start&&data.end&&data.current!=='Yes'&&data.end<data.start){toast('End date must follow start date');return}if(col==='profile')Object.assign(S.profile,data);else{var rec=S[col].find(function(r){return r.id===form.dataset.id});if(rec)Object.assign(rec,data);else S[col].push(Object.assign({},DEF[col](),data,{id:uid()}))}save();closeFocusEditor();render();toast('Changes saved')},
"focus-letter":function(b){focusPane='review';focusReviewTab='letter';syncFocusWorkspace();var field=document.querySelector('[data-cover="'+b.dataset.id+'"]');if(field){field.scrollIntoView({block:'center'});field.focus()}},
"preview-fit":function(b){previewMode=b.dataset.id;S.resume.preview={mode:previewMode,zoom:S.resume.preview?S.resume.preview.zoom:90};save();fitResumePreview()},
"preview-zoom":function(b){var p=document.querySelector('#paper');previewZoom=Math.max(.25,Math.min(1.5,Number(p.style.zoom||1)+(b.dataset.id==='in'?.1:-.1)));previewMode='custom';S.resume.preview={mode:'custom',zoom:Math.round(previewZoom*100)};save();fitResumePreview()},
"note-edit":function(t){var k=t.dataset.note;if(k&&['__proto__','constructor','prototype'].indexOf(k)<0){S.notes[k]=t.value;saveSoon()}},
"dialog-save":function(form){if(dialogSave&&dialogSave(Object.fromEntries(new FormData(form)))!==false)$("#dlg").close()},
"dlgdel":function(){if(dialogDelete&&confirm("Delete this item?")){dialogDelete();$("#dlg").close()}},
"profile-save":function(form){S.profile=clean('profile',Object.fromEntries(new FormData(form)));save();render();toast("Profile saved")},
"cover-edit":function(t){if(SCH.cover.f.some(function(f){return f[0]===t.dataset.cover})){S.cover[t.dataset.cover]=t.value;saveSoon();refreshPaper()}},
"doc-size":function(b){var k=b.dataset.id;if(!Object.prototype.hasOwnProperty.call(S.resume.sizes,k))return;var step=Number(b.dataset.step);if(step!==5&&step!==-5)return;S.resume.sizes[k]=Math.max(80,Math.min(120,S.resume.sizes[k]+step));save();refreshSizeControls()},
"size-reset":function(){S.resume.sizes={name:100,headings:100,text:100,spacing:100};save();refreshSizeControls()},
"header-align":function(b){if(["left","center"].indexOf(b.dataset.id)<0)return;S.resume.headerAlign=b.dataset.id;save();render()},
"edit-profile":editResumeProfile,
"edit-section":function(b){if(S.settings.focus)focusEditSection(b.dataset.section);else editResumeSection(b.dataset.section)},
"section-up":function(b){shiftResumeSection(b.dataset.section,-1)},
"section-down":function(b){shiftResumeSection(b.dataset.section,1)},
"section-column":function(b){var key=b.dataset.section;moveResumeSection(key,columnLayout().side.indexOf(key)>=0?'main':'side')},
"cover-template":function(b){S.resume.template=RESUME_TEMPLATES.indexOf(b.value)>=0?b.value:'executive';save();render()},
"cover-application":function(b){var a=S.applications.filter(function(x){return x.id===b.value})[0];S.cover.applicationId=a?a.id:'';if(a){S.cover.company=a.company;S.cover.role=a.role;S.cover.recipient=a.contact||''}save();render()},
"theme-toggle":function(){setAppearance('theme',S.settings.theme==='dark'?'light':'dark')},
"go-tab":function(b){goTab(b.dataset.id)},
"appearance-toggle":function(){appearanceOpen=!appearanceOpen;renderAppearance();var target=document.querySelector(appearanceOpen?'[data-act=accent-set][aria-pressed=true]':'[data-act=appearance-toggle]');if(target)target.focus()},
"accent-set":function(b){if(Object.prototype.hasOwnProperty.call(ACCENTS,b.dataset.id))setAppearance('accent',b.dataset.id)},
"focus-off":function(){S.settings.focus=false;save();render()},
"backup":function(){dlBlob("career-hub-backup.json",new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));toast("Backup downloaded")},
"restore":function(){var f=document.createElement("input");f.type="file";f.accept=".json,application/json";f.onchange=async function(){try{var raw=JSON.parse(await f.files[0].text());if(!raw||typeof raw!=="object"||!raw.profile||typeof raw.profile!=="object"||Array.isArray(raw.profile)||!Array.isArray(raw.experiences))throw new Error("Invalid backup");if(COLLECTIONS.some(function(k){return raw[k]!=null&&(!Array.isArray(raw[k])||raw[k].some(function(x){return !x||typeof x!=="object"||Array.isArray(x)}))}))throw new Error("Invalid backup");if(raw.version>VER)throw new Error("Unsupported backup version");var restored=norm(migrate(raw));if(!confirm("Replace current data with this backup?"))return;sampleMode=false;storageReadOnly=false;S=restored;save();render();toast("Backup restored")}catch(e){toast("Invalid backup — data unchanged")}};f.click()},
close:function(){$("#dlg").close()},
new:function(b){edit(b.dataset.col,null)},
edit:function(b){edit(b.dataset.col,b.dataset.id)},
del:function(b){if(confirm("Delete this?")){S[b.dataset.col]=S[b.dataset.col].filter(function(x){return x.id!==b.dataset.id});save();render();toast("Deleted")}},
banktab:function(b){bankTab=b.dataset.id;render()},
tab:function(b){goTab(b.dataset.id)},
"go-bank":function(){goTab("bank")},
"go-resume":function(){goTab("resume")},
sample:function(){loadSample()},
"hide-banner":function(){bannerHidden=true;var b=$("#sample-banner");if(b)b.remove()},
move:function(b){var a=S.applications.filter(function(x){return x.id===b.dataset.id})[0];if(!a)return;if(a.status===b.value)return;a.status=b.value;save();render();toast("Moved to "+a.status)},
inc:function(b){var k=b.dataset.kind+":"+b.dataset.id;S.resume.inc[k]=b.checked;save();refreshPaper()},
tpl:function(b){if(RESUME_TEMPLATES.indexOf(b.dataset.id)<0)return;S.resume.template=b.dataset.id;save();render()},
raccent:function(b){if(!Object.prototype.hasOwnProperty.call(RESUME_ACCENTS,b.dataset.id))return;S.resume.accent=b.dataset.id;save();render()},
"dl-pdf":function(){downloadPdf()},
"mark-applied":function(b){var a=S.applications.filter(function(x){return x.id===b.dataset.id})[0];if(!a)return;a.status="Applied";if(!a.applied)a.applied=iso();save();render();toast("Marked as applied")},
"draft-email":function(b){var a=S.applications.filter(function(x){return x.id===b.dataset.id})[0]||{company:"[Company]",role:"[Role]"};var today=iso();var days=Math.floor((Date.now()-new Date((a.applied||today)+"T00:00"))/86400000);var tpl="Hi "+(a.contact||"[Name]")+",\n\nQuick follow-up on my application for the "+a.role+" role at "+a.company+(days>0?" — sent "+days+" day"+(days===1?"":"s")+" ago":"")+".\n\nI'm still very interested and would love to know if there's any update on timing. Happy to share additional work samples if useful.\n\nThanks for your time,\n"+(S.profile.name||"[Your name]");openInfo("Draft follow-up email",'<label>Copy and paste into your email<textarea id="emailtext" rows="12">'+E(tpl)+'</textarea></label><div class="foot"><button type="button" data-act="close">Close</button><button type="button" class="primary" data-act="copy-email">Copy</button></div>')},
"copy-email":function(){var t=$("#emailtext");if(t)Promise.resolve().then(function(){if(!navigator.clipboard)throw new Error("Clipboard unavailable");return navigator.clipboard.writeText(t.value)}).then(function(){toast("Copied")}).catch(function(){toast("Copy failed")})},
reset:function(){if(confirm("Erase ALL data? Cannot undo.")&&confirm("Really erase everything?")){storageReadOnly=false;sampleMode=false;bannerHidden=false;S=blank();save();render();toast("All data removed")}}
};

document.addEventListener("click",function(e){
if(Date.now()-lastDrop<300)return;
var t=e.target.closest("[data-act]");if(!t)return;
if(t.tagName==="SELECT"||t.tagName==="INPUT"||t.tagName==="TEXTAREA")return;
if(t.tagName==='FORM'||(t.type==='submit'&&t.closest('form')))return;var fn=Object.prototype.hasOwnProperty.call(A,t.dataset.act)?A[t.dataset.act]:null;if(fn)fn(t);
});
document.addEventListener("change",function(e){
var t=e.target;
if(t.dataset.act==='cover-edit'){A['cover-edit'](t);return}
if(t.type==="checkbox"&&t.dataset.act&&A[t.dataset.act]){A[t.dataset.act](t)}
else if(t.tagName==="SELECT"&&t.dataset.act&&A[t.dataset.act]){A[t.dataset.act](t)}
else if(t.dataset&&t.dataset.note){A['note-edit'](t)}
});
document.addEventListener("input",function(e){var t=e.target;if(t.dataset.act==='cover-edit'){A['cover-edit'](t);return}if(t.dataset&&t.dataset.note){A['note-edit'](t)}});
document.addEventListener("keydown",function(e){var card=e.target.closest&&e.target.closest(".kcard[data-act=edit]");if(card&&(e.key==="Enter"||e.key===" ")){e.preventDefault();A.edit(card)}});
document.addEventListener("submit",function(e){
var act=e.target.dataset.act;if(act&&Object.prototype.hasOwnProperty.call(A,act)){e.preventDefault();A[act](e.target)}
});
document.addEventListener("dragstart",function(e){var row=e.target.closest('[data-resume-section]');if(!row||view!=='resume')return;if(e.target.closest('button,input,textarea,select')){e.preventDefault();return}e.dataTransfer.setData('application/x-career-section',row.dataset.resumeSection);e.dataTransfer.effectAllowed='move';row.classList.add('section-dragging')});
document.addEventListener("dragend",function(){document.querySelectorAll('.section-dragging,.section-over').forEach(function(n){n.classList.remove('section-dragging','section-over')})});
document.addEventListener("dragover",function(e){if(view!=='resume'||!Array.from(e.dataTransfer.types).includes('application/x-career-section'))return;var zone=e.target.closest('[data-resume-zone]');if(zone){e.preventDefault();e.dataTransfer.dropEffect='move';zone.classList.add('section-over')}});
document.addEventListener("dragleave",function(e){var zone=e.target.closest('[data-resume-zone]');if(zone&&!zone.contains(e.relatedTarget))zone.classList.remove('section-over')});
document.addEventListener("drop",function(e){var key=e.dataTransfer.getData('application/x-career-section'),zone=e.target.closest('[data-resume-zone]');if(!key||!zone||view!=='resume')return;e.preventDefault();e.stopPropagation();var row=e.target.closest('[data-resume-section]'),before=row&&row.dataset.resumeSection;if(before===key)return;lastDrop=Date.now();moveResumeSection(key,zone.dataset.resumeZone,before);toast('Section order saved')});
document.addEventListener("dragstart",function(e){var c=e.target.closest(".kcard");if(!c)return;e.dataTransfer.setData("text/plain",c.dataset.id);e.dataTransfer.effectAllowed="move";c.classList.add("drag")});
document.addEventListener("dragend",function(e){var c=e.target.closest(".kcard");if(c)c.classList.remove("drag");$$(".kan-col.over").forEach(function(z){z.classList.remove("over")})});
document.addEventListener("dragover",function(e){var z=e.target.closest("[data-drop]");if(!z)return;e.preventDefault();z.classList.add("over")});
document.addEventListener("dragleave",function(e){var z=e.target.closest("[data-drop]");if(z&&!z.contains(e.relatedTarget))z.classList.remove("over")});
document.addEventListener("drop",function(e){var z=e.target.closest("[data-drop]");if(!z)return;e.preventDefault();z.classList.remove("over");lastDrop=Date.now();var id=e.dataTransfer.getData("text/plain");var a=S.applications.filter(function(x){return x.id===id})[0];if(a&&a.status!==z.dataset.drop){a.status=z.dataset.drop;save();render();toast("Moved to "+a.status)}});
document.addEventListener("click",function(e){var a=e.target.closest('nav a[href^="#"]');if(!a)return;var h=a.getAttribute("href").slice(1);if(h===view){e.preventDefault();scrollTo({top:0,behavior:"smooth"})}});
addEventListener("hashchange",function(){var h=location.hash.slice(1);view=TITLES[h]?h:"hub";render();scrollTo(0,0)});
$("#dlg").addEventListener("close",function(){if(dialogTrigger&&dialogTrigger.isConnected)dialogTrigger.focus()});
addEventListener("beforeunload",function(){if(!storageReadOnly)lsSet(JSON.parse(JSON.stringify(S)))});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden"&&!storageReadOnly)lsSet(JSON.parse(JSON.stringify(S)))});
(function(){var h=location.hash.slice(1);view=TITLES[h]?h:"hub";load()})();
